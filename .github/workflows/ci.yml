name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - run: nix build .#t3code --print-build-logs
      - run: test -x result/bin/t3code
      - run: nix build .#server --print-build-logs
      - run: test -x result/bin/t3code-server
