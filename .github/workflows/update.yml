name: Update latest nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      delay_hours:
        description: Minimum nightly age in hours (0 means latest)
        default: "0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Select delayed nightly
        env:
          T3CODE_DELAY_HOURS: ${{ inputs.delay_hours || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update.sh
      - run: nix flake check --print-build-logs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-delayed-nightly
          delete-branch: true
          commit-message: "t3code: update latest nightly"
          title: "t3code: update latest nightly"
          body: |
            Automated update to the newest T3 Code nightly matching the configured minimum age.
          labels: dependencies
