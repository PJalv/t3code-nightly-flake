name: Check for newer nightly

# Upgrades need the personal patch rebased onto the new source, which this
# job cannot do, so it only reports whether a newer nightly exists.
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      delay_hours:
        description: Minimum nightly age in hours (0 means latest)
        default: "0"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for a newer nightly
        env:
          T3CODE_DELAY_HOURS: ${{ inputs.delay_hours || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          output="$(./scripts/update.sh --check)" || status=$?
          echo "$output"
          case "$status" in
            0) ;;
            10) echo "::notice title=Newer T3 Code nightly::$output" ;;
            *) exit "$status" ;;
          esac
          echo "$output" >> "$GITHUB_STEP_SUMMARY"
